<style data-hidden-gem-page-styles>
  /* Hidden Gem sections are rendered from Community.dc.html, so these styles live on the public pages where browsers reliably load them. */
  .hidden-gem-section {
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, #fffdf8 0%, #f8f1e7 100%);
    padding: clamp(78px, 9vw, 118px) 0;
    border-top: 1px solid rgba(23,49,41,0.10);
    border-bottom: 1px solid rgba(23,49,41,0.08);
  }
  .hidden-gem-section::before {
    content: "";
    position: absolute;
    right: -170px;
    top: -210px;
    width: 440px;
    height: 440px;
    border-radius: 999px;
    background: radial-gradient(circle, rgba(176,141,87,0.18), rgba(176,141,87,0));
    pointer-events: none;
  }
  .hidden-gem-section::after {
    content: "";
    position: absolute;
    left: -220px;
    bottom: -260px;
    width: 520px;
    height: 520px;
    border-radius: 999px;
    background: radial-gradient(circle, rgba(23,49,41,0.08), rgba(23,49,41,0));
    pointer-events: none;
  }
  .hidden-gem-inner {
    position: relative;
    z-index: 1;
    width: min(1080px, calc(100% - 48px));
    margin: 0 auto;
  }
  .hidden-gem-intro {
    display: grid;
    grid-template-columns: minmax(220px, 0.78fr) minmax(0, 1.22fr);
    gap: clamp(30px, 5vw, 72px);
    align-items: end;
    margin-bottom: clamp(34px, 5vw, 54px);
  }
  .hidden-gem-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 16px;
    color: #b08d57;
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.28em;
    text-transform: uppercase;
  }
  .hidden-gem-eyebrow::before {
    content: "";
    width: 34px;
    height: 1px;
    background: #b08d57;
    display: inline-block;
  }
  .hidden-gem-heading {
    margin: 0;
    color: #173129;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: clamp(2.25rem, 4.8vw, 4rem);
    font-weight: 500;
    line-height: 0.98;
    letter-spacing: -0.02em;
  }
  .hidden-gem-subcopy {
    margin: 0;
    color: #4a4f46;
    font-size: clamp(1rem, 1.35vw, 1.13rem);
    line-height: 1.72;
    max-width: 620px;
  }
  .hidden-gem-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr));
    gap: 22px;
    align-items: stretch;
    max-width: 1080px;
  }
  .hidden-gem-grid.is-single {
    max-width: 760px;
  }
  .hidden-gem-card {
    position: relative;
    min-width: 0;
    overflow: hidden;
    background: rgba(255,253,248,0.94);
    border: 1px solid rgba(176,141,87,0.34);
    border-radius: 6px;
    padding: clamp(30px, 4vw, 46px);
    box-shadow: 0 22px 55px rgba(23,49,41,0.09);
    display: flex;
    flex-direction: column;
  }
  .hidden-gem-card::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 5px;
    background: linear-gradient(90deg, #173129, #b08d57);
  }
  .hidden-gem-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 24px;
  }
  .hidden-gem-number {
    width: 42px;
    height: 42px;
    border-radius: 999px;
    background: #173129;
    color: #f4ede1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    flex: 0 0 auto;
  }
  .hidden-gem-type {
    margin: 0;
    color: #b08d57;
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-align: right;
  }
  .hidden-gem-title {
    margin: 0 0 18px;
    color: #173129;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: clamp(2rem, 3.4vw, 3rem);
    line-height: 1.02;
    font-weight: 500;
    letter-spacing: -0.02em;
  }
  .hidden-gem-copy {
    margin: 0 0 28px;
    color: #4a4f46;
    font-size: 1.04rem;
    line-height: 1.72;
    flex: 1;
  }
  .hidden-gem-link {
    display: inline-block;
    align-self: flex-start;
    text-decoration: none;
    background: #173129;
    color: #f4ede1;
    border: 1px solid #173129;
    padding: 14px 24px;
    border-radius: 2px;
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    transition: background .25s ease, color .25s ease, border-color .25s ease, transform .25s ease;
  }
  .hidden-gem-link:hover {
    background: #b08d57;
    border-color: #b08d57;
    color: #fffdf8;
    transform: translateY(-1px);
  }
  @media (max-width: 760px) {
    .hidden-gem-section { padding: 64px 0; }
    .hidden-gem-inner { width: min(100% - 32px, 1080px); }
    .hidden-gem-intro { grid-template-columns: 1fr; gap: 18px; margin-bottom: 30px; }
    .hidden-gem-eyebrow { font-size: 0.64rem; letter-spacing: 0.22em; margin-bottom: 12px; }
    .hidden-gem-eyebrow::before { width: 26px; }
    .hidden-gem-heading { font-size: clamp(2.15rem, 12vw, 3rem); }
    .hidden-gem-subcopy { font-size: 0.98rem; line-height: 1.62; }
    .hidden-gem-grid, .hidden-gem-grid.is-single { grid-template-columns: 1fr; gap: 16px; max-width: none; }
    .hidden-gem-card { padding: 30px 22px 26px; }
    .hidden-gem-card-top { align-items: flex-start; margin-bottom: 20px; }
    .hidden-gem-number { width: 38px; height: 38px; }
    .hidden-gem-type { font-size: 0.62rem; letter-spacing: 0.13em; max-width: 160px; }
    .hidden-gem-title { font-size: clamp(2rem, 11vw, 2.65rem); margin-bottom: 14px; }
    .hidden-gem-copy { font-size: 0.98rem; line-height: 1.64; margin-bottom: 24px; }
    .hidden-gem-link { display: block; width: 100%; text-align: center; box-sizing: border-box; }
  }
</style>
